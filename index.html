<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRD — منصة ترجمة وتلخيص وترتيب محاضرات طب الأسنان | د. عبدالله فاضل</title>
    <meta
      name="description"
      content="FRD: منصة تفاعلية متقدمة لطلاب طب الأسنان لرفع ملفات PDF و PPTX، ترجمة كل سطر باللغة العربية أسفل النص، استخراج الملخص السريري الذكي، ترتيب المحاضرة في شرائح، قاموس سني شامل، واختبارات تفاعلية."
    />
    <meta name="theme-color" content="#0B0F19" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/tooth.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dsp.theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'day';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
